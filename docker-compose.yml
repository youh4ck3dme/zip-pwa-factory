version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3333"
    environment:
      - VITE_SUPABASE_URL=http://supabase:54321
      - VITE_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - SENTINEL_THRESHOLD=0.85
    depends_on:
      - supabase
    volumes:
      - .:/app
      - /app/node_modules

  supabase:
    image: supabase/postgres:15.1.0.73
    ports:
      - "54320:5432"
      - "54321:54321"
      - "54323:3000"
    environment:
      - POSTGRES_PASSWORD=postgres
      - JWT_SECRET=your-jwt-secret
      - JWT_EXPIRY=3600
    volumes:
      - supabase_data:/var/lib/postgresql/data
      - ./supabase:/docker-entrypoint-initdb.d

volumes:
  supabase_data:
